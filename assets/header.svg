<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 300" width="840" height="300" role="img" aria-labelledby="t d">
  <title id="t">canvas-api-mcp</title>
  <desc id="d">A terminal shows two questions. "What courses am I taking this sem?" is answered instantly by the curated my_courses tool, listing CS3230, CS2040S, MA2001 and GEA1000. "What groups am I in?" has no curated tool, so search_canvas_api finds GET /v1/users/self/groups among 1,116 Canvas endpoints and canvas_request executes it. 17 tools, 1,116 endpoints reachable, 120 tests, MIT licence.</desc>

  <style>
    .mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; }
    .win  { fill: #0d1117; }
    .bar  { fill: #161b22; }
    .edge { stroke: #30363d; stroke-width: 1; fill: none; }
    .dim  { fill: #7d8590; }
    .fg   { fill: #e6edf3; }
    .acc  { fill: #2f81f7; }
    .ok   { fill: #3fb950; }
    .warn { fill: #d29922; }

    .line { opacity: 0; animation: show 15s infinite; }
    @keyframes show { 0%,3% { opacity: 0 } 5%,93% { opacity: 1 } 97%,100% { opacity: 0 } }

    /* beat 1 — the common question, curated fast path */
    .a1 { animation-delay: 0.0s }
    .a2 { animation-delay: 1.3s }
    .a3 { animation-delay: 2.1s }
    /* beat 2 — the unusual question, gateway */
    .b1 { animation-delay: 4.0s }
    .b2 { animation-delay: 5.2s }
    .b3 { animation-delay: 6.2s }
    .b4 { animation-delay: 7.2s }
    .ft { animation-delay: 8.4s }

    .caret { animation: blink 1.1s steps(1) infinite; }
    @keyframes blink { 0%,50% { opacity: 1 } 51%,100% { opacity: 0 } }

    @media (prefers-reduced-motion: reduce) {
      .line { opacity: 1; animation: none }
      .caret { animation: none; opacity: 0 }
    }
  </style>

  <rect class="win" x="0.5" y="0.5" width="839" height="299" rx="10"/>
  <rect class="bar" x="0.5" y="0.5" width="839" height="34" rx="10"/>
  <rect class="bar" x="0.5" y="24" width="839" height="12"/>
  <rect class="edge" x="0.5" y="0.5" width="839" height="299" rx="10"/>
  <line class="edge" x1="0.5" y1="35" x2="839.5" y2="35"/>
  <circle cx="22" cy="18" r="5.5" fill="#ff5f57"/>
  <circle cx="42" cy="18" r="5.5" fill="#febc2e"/>
  <circle cx="62" cy="18" r="5.5" fill="#28c840"/>
  <text class="mono dim" x="420" y="22" font-size="12" text-anchor="middle">canvas-api-mcp</text>

  <!-- beat 1 : curated fast path -->
  <g class="line a1">
    <text class="mono ok" x="28" y="72" font-size="15">❯</text>
    <text class="mono fg" x="48" y="72" font-size="15">what courses am I taking this sem?</text>
  </g>
  <g class="line a2">
    <text class="mono acc" x="48" y="98" font-size="13">my_courses()</text>
    <text class="mono dim" x="152" y="98" font-size="13">curated tool — one call, no lookup</text>
  </g>
  <g class="line a3">
    <text class="mono fg"  x="68" y="120" font-size="13">CS3230</text>
    <text class="mono dim" x="128" y="120" font-size="13">·</text>
    <text class="mono fg"  x="142" y="120" font-size="13">CS2040S</text>
    <text class="mono dim" x="212" y="120" font-size="13">·</text>
    <text class="mono fg"  x="226" y="120" font-size="13">MA2001</text>
    <text class="mono dim" x="286" y="120" font-size="13">·</text>
    <text class="mono fg"  x="300" y="120" font-size="13">GEA1000</text>
  </g>

  <!-- beat 2 : gateway -->
  <g class="line b1">
    <text class="mono ok" x="28" y="164" font-size="15">❯</text>
    <text class="mono fg" x="48" y="164" font-size="15">what groups am I in?</text>
    <rect class="caret" x="243" y="151" width="8" height="17" fill="#e6edf3"/>
  </g>
  <g class="line b2">
    <text class="mono warn" x="48" y="188" font-size="12">no curated tool for this — searching 1,116 endpoints…</text>
  </g>
  <g class="line b3">
    <text class="mono acc" x="48" y="212" font-size="13">search_canvas_api</text>
    <text class="mono dim" x="178" y="212" font-size="13">→</text>
    <text class="mono ok"  x="198" y="212" font-size="13">GET</text>
    <text class="mono fg"  x="230" y="212" font-size="13">/v1/users/self/groups</text>
  </g>
  <g class="line b4">
    <text class="mono acc" x="48" y="234" font-size="13">canvas_request</text>
    <text class="mono dim" x="158" y="234" font-size="13">→</text>
    <text class="mono ok"  x="178" y="234" font-size="13">200</text>
    <text class="mono dim" x="212" y="234" font-size="13">found it without anyone writing a tool for it</text>
  </g>

  <g class="line ft">
    <line class="edge" x1="28" y1="258" x2="812" y2="258"/>
    <text class="mono dim" x="28" y="280" font-size="12">17 tools</text>
    <text class="mono dim" x="96" y="280" font-size="12">·</text>
    <text class="mono fg"  x="110" y="280" font-size="12">1,116 endpoints reachable</text>
    <text class="mono dim" x="288" y="280" font-size="12">·</text>
    <text class="mono dim" x="302" y="280" font-size="12">120 tests</text>
    <text class="mono dim" x="376" y="280" font-size="12">·</text>
    <text class="mono dim" x="390" y="280" font-size="12">MIT</text>
    <text class="mono dim" x="812" y="280" font-size="12" text-anchor="end">uvx canvas-api-mcp</text>
  </g>
</svg>
