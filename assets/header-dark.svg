<svg viewBox="0 0 800 260" xmlns="http://www.w3.org/2000/svg" xml:space="preserve" role="img" aria-labelledby="svgTitleDark svgDescDark">
<title id="svgTitleDark">canvas-api-mcp — live gateway demo</title>
<desc id="svgDescDark">Terminal recording: a student asks "what groups am I in?" The gateway calls search_canvas_api, discovers GET /v1/users/self/groups, then calls it directly with canvas_request — no curated tool needed for this endpoint. 17 tools, 1,116 endpoints, 120 tests, MIT licensed.</desc>
<style>
<![CDATA[
text{ font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
.page{ fill: #0d1117; }
.winbg{ fill: #12151a; stroke: #262b33; stroke-width:1; }
.chrome{ fill: #1a1d24; }
.footerbar{ fill: #14171d; }
.footerline{ fill: #262b33; }
.dot-r{ fill:#ff5f57; opacity:.55; }
.dot-y{ fill:#ffbd2e; opacity:.55; }
.dot-g{ fill:#28c840; opacity:.55; }
.titletext{ fill: #8b93a1; font-size:12px; text-anchor:middle; }
.footertext{ fill: #8b93a1; font-size:12px; }
.fg-primary{ fill: #e6e8eb; }
.fg-accent{ fill: #f2545c; }
.fg-dim{ fill: #8b93a1; }
.fg-dim2{ fill: #636b78; }

.content{ animation: fadeContent 13s linear infinite; }
@keyframes fadeContent{
  0%,3.08%{ opacity:0; }
  5.77%{ opacity:1; }
  90.77%{ opacity:1; }
  93.85%{ opacity:0; }
  100%{ opacity:0; }
}

.revealL1,.revealL2,.revealL4{ transform-box: fill-box; transform-origin: 0% 50%; }
.revealL1{ animation: typeL1 13s linear infinite; }
.revealL2{ animation: typeL2 13s linear infinite; }
.revealL4{ animation: typeL4 13s linear infinite; }

@keyframes typeL1{
  0%,5.77%{ transform: scaleX(0); animation-timing-function: steps(22,end); }
  13.73%{ transform: scaleX(1); }
  100%{ transform: scaleX(1); }
}
@keyframes typeL2{
  0%,18.46%{ transform: scaleX(0); animation-timing-function: steps(43,end); }
  28.38%{ transform: scaleX(1); }
  100%{ transform: scaleX(1); }
}
@keyframes typeL4{
  0%,42.31%{ transform: scaleX(0); animation-timing-function: steps(48,end); }
  52.28%{ transform: scaleX(1); }
  100%{ transform: scaleX(1); }
}

.fadeL2b{ animation: fadeL2b 13s linear infinite; }
.fadeL3b{ animation: fadeL3b 13s linear infinite; }
.fadeComment{ animation: fadeComment 13s linear infinite; transform-box: fill-box; }
@keyframes fadeL2b{ 0%,30.77%{opacity:0;} 33.08%{opacity:1;} 100%{opacity:1;} }
@keyframes fadeL3b{ 0%,54.62%{opacity:0;} 56.92%{opacity:1;} 100%{opacity:1;} }
@keyframes fadeComment{
  0%,63.85%{ opacity:0; transform:translateY(6px); }
  66.92%{ opacity:1; transform:translateY(0); }
  100%{ opacity:1; transform:translateY(0); }
}

.dotsA{ animation: dotsA 13s linear infinite; }
.dotsB{ animation: dotsB 13s linear infinite; }
@keyframes dotsA{ 0%,13.73%{opacity:0;} 14.3%{opacity:1;} 17.7%{opacity:1;} 18.46%{opacity:0;} 100%{opacity:0;} }
@keyframes dotsB{ 0%,33.08%{opacity:0;} 36.8%{opacity:1;} 40.8%{opacity:1;} 41.5%{opacity:0;} 100%{opacity:0;} }
.dot{ fill: #636b78; animation: dotpulse 1s ease-in-out infinite; }
.dot.d2{ animation-delay:.15s; }
.dot.d3{ animation-delay:.3s; }
@keyframes dotpulse{ 0%,100%{opacity:.25;} 50%{opacity:1;} }

.caret{ animation: caretMove 13s linear infinite; }
@keyframes caretMove{
  0%,5.76%{ opacity:0; transform:translate(44px,58px); }
  5.77%{ opacity:1; transform:translate(44px,58px); animation-timing-function: steps(22,end); }
  13.73%{ opacity:1; transform:translate(233.2px,58px); }
  13.74%{ opacity:0; }
  18.45%{ opacity:0; transform:translate(44px,86px); }
  18.46%{ opacity:1; transform:translate(44px,86px); animation-timing-function: steps(43,end); }
  28.38%{ opacity:1; transform:translate(413.8px,86px); }
  28.39%{ opacity:0; }
  42.30%{ opacity:0; transform:translate(44px,138px); }
  42.31%{ opacity:1; transform:translate(44px,138px); animation-timing-function: steps(48,end); }
  52.28%{ opacity:1; transform:translate(456.8px,138px); }
  52.29%,100%{ opacity:0; }
}
.blinkrect{ fill: #f2545c; animation: blink .9s steps(1,end) infinite; }
@keyframes blink{ 0%,45%{opacity:.85;} 50%,95%{opacity:.15;} 100%{opacity:.85;} }

@media (prefers-reduced-motion: reduce){
  .content,.revealL1,.revealL2,.revealL4,.fadeL2b,.fadeL3b,.fadeComment,.dotsA,.dotsB,.dot,.caret,.blinkrect{
    animation: none;
  }
  .content{ opacity:1; }
  .revealL1,.revealL2,.revealL4{ transform: scaleX(1); }
  .fadeL2b,.fadeL3b{ opacity:1; }
  .fadeComment{ opacity:1; transform: translateY(0); }
  .dotsA,.dotsB,.caret{ opacity:0; }
}
]]>
</style>

<defs>
  <filter id="winShadow" x="-20%" y="-20%" width="140%" height="160%">
    <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#000000" flood-opacity="0.35"/>
  </filter>
  <clipPath id="clipL1"><rect class="revealL1" x="44" y="52" width="190" height="28"/></clipPath>
  <clipPath id="clipL2"><rect class="revealL2" x="44" y="80" width="371" height="28"/></clipPath>
  <clipPath id="clipL4"><rect class="revealL4" x="44" y="132" width="414" height="28"/></clipPath>
</defs>

<rect class="page" x="0" y="0" width="800" height="260"/>

<rect class="winbg" x="20" y="10" width="760" height="240" rx="12" filter="url(#winShadow)"/>
<rect class="chrome" x="20" y="10" width="760" height="34" rx="12"/>
<rect class="chrome" x="20" y="22" width="760" height="22"/>
<circle class="dot-r" cx="40" cy="27" r="5"/>
<circle class="dot-y" cx="56" cy="27" r="5"/>
<circle class="dot-g" cx="72" cy="27" r="5"/>
<text class="titletext" x="400" y="31">zsh — canvas-api-mcp</text>

<rect class="footerbar" x="20" y="226" width="760" height="24" rx="12"/>
<rect class="footerbar" x="20" y="226" width="760" height="12"/>
<rect class="footerline" x="20" y="226" width="760" height="1"/>
<text class="footertext" x="44" y="242">17 tools · 1,116 endpoints · 120 tests · MIT</text>

<g class="content">
  <g clip-path="url(#clipL1)">
    <text x="44" y="72" font-size="15" textLength="189.2" lengthAdjust="spacingAndGlyphs"><tspan class="fg-accent">$</tspan><tspan class="fg-primary"> what groups am I in?</tspan></text>
  </g>

  <g class="dotsA">
    <circle class="dot d1" cx="44" cy="94" r="2.4"/>
    <circle class="dot d2" cx="54" cy="94" r="2.4"/>
    <circle class="dot d3" cx="64" cy="94" r="2.4"/>
  </g>

  <g clip-path="url(#clipL2)">
    <text x="44" y="100" font-size="15" textLength="369.8" lengthAdjust="spacingAndGlyphs"><tspan class="fg-accent">→</tspan><tspan class="fg-primary"> search_canvas_api("my group memberships")</tspan></text>
  </g>

  <text class="fadeL2b fg-dim" x="64" y="124" font-size="14">GET /v1/users/self/groups   <tspan class="fg-dim2">"List your groups"</tspan></text>

  <g class="dotsB">
    <circle class="dot d1" cx="44" cy="146" r="2.4"/>
    <circle class="dot d2" cx="54" cy="146" r="2.4"/>
    <circle class="dot d3" cx="64" cy="146" r="2.4"/>
  </g>

  <g clip-path="url(#clipL4)">
    <text x="44" y="152" font-size="15" textLength="412.8" lengthAdjust="spacingAndGlyphs"><tspan class="fg-accent">→</tspan><tspan class="fg-primary"> canvas_request("GET", "/v1/users/self/groups")</tspan></text>
  </g>

  <text class="fadeL3b fg-dim" x="64" y="176" font-size="14">https://canvas.nus.edu.sg/api/v1/users/self/groups</text>

  <text class="fadeComment fg-accent" x="44" y="206" font-size="15" font-weight="600"># No curated tool covers this. The gateway found it.</text>

  <g class="caret">
    <rect class="blinkrect" x="0" y="0" width="8" height="18"/>
  </g>
</g>
</svg>
