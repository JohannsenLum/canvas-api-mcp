name: Notify Telegram (CI)

# Pings Telegram when CI or the publish pipeline finishes — but only when the
# outcome is worth interrupting someone for.
#
# WHAT IT SENDS:
#   - Any Test run finishing on main — pass or fail. Green on main doubles as the
#     "your push landed and is healthy" signal, which is what makes this topic a
#     usable deployment log rather than a pure alarm.
#   - Publish finished (either way)  → a release either shipped or didn't
#
# WHAT IT DELIBERATELY DOES NOT SEND:
#   - Test failing on a PR. The contributor sees that on their own PR, and it is
#     their job to fix before you look. PR-branch noise would swamp the topic.
#   - Run started / in progress. You cannot act on "it began".
#
# If green-on-main ever becomes noise, restore the `conclusion != 'success'`
# clause in the job's `if:` and this reverts to failures-only.
#
# SECURITY: `workflow_run` always executes in the base-repo context, never with
# PR code, so secrets are safe here. As with notify-telegram.yml, do NOT add a
# checkout step, and keep untrusted values in `env:` rather than interpolating
# them into `run:`.

on:
  workflow_run:
    workflows: [Test, Publish]
    types: [completed]

permissions: {}

jobs:
  telegram:
    runs-on: ubuntu-latest
    if: >-
      github.event.workflow_run.name == 'Publish' ||
      github.event.workflow_run.conclusion == 'action_required' ||
      github.event.workflow_run.head_branch == 'main'
    steps:
      - name: Send Telegram message
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
          # Deployment/CI noise goes to Dev Ops. The one exception is "CI is waiting
          # for your approval", which is about a specific PR and belongs where you'd
          # act on it — it gets its own topic because it is rare, silently blocking,
# and has no other symptom. Unset -> posts to General.
          TOPIC_DEVOPS: ${{ vars.TELEGRAM_TOPIC_DEVOPS }}
          TOPIC_APPROVALS: ${{ vars.TELEGRAM_TOPIC_APPROVALS }}
          WF_NAME: ${{ github.event.workflow_run.name }}
          CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          BRANCH: ${{ github.event.workflow_run.head_branch }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          COMMIT_MSG: ${{ github.event.workflow_run.head_commit.message }}
          ACTOR: ${{ github.event.workflow_run.actor.login }}
        run: |
          set -euo pipefail

          if [ -z "${TG_TOKEN:-}" ] || [ -z "${TG_CHAT:-}" ]; then
            echo "Telegram secrets not set — skipping."
            exit 0
          fi

          # export, not plain assignment — the python heredoc is a subprocess.
          case "$CONCLUSION" in
            success)         export ICON="✅" ;;
            failure)         export ICON="❌" ;;
            cancelled)       export ICON="⚪" ;;
            action_required) export ICON="⏸️" ;;
            *)               export ICON="⚠️" ;;
          esac

          # A fork PR from a first-time contributor holds CI until you approve it.
          # Nothing else tells you that — you'd otherwise find out by wondering why
          # a PR sat with no checks. Route it to the PR topic, where you'd act.
          if [ "$CONCLUSION" = "action_required" ]; then
            export TG_TOPIC="${TOPIC_APPROVALS:-}"
          else
            export TG_TOPIC="${TOPIC_DEVOPS:-}"
          fi

          python3 - <<'PY' > /tmp/ci_payload.json
          import html, json, os

          # Telegram's HTML mode allows only b/i/u/s/a/code/pre. Anything else
          # returns 400 "can't parse entities" and the message silently vanishes,
          # so escape every value that came from a human.
          def esc(v, n):
              return html.escape((v or "")[:n], quote=False)

          wf = os.environ["WF_NAME"]
          concl = os.environ["CONCLUSION"]
          # First line of the commit message only — bodies are long and noisy.
          subject = (os.environ.get("COMMIT_MSG") or "").splitlines()
          subject = subject[0] if subject else ""

          if concl == "action_required":
              headline = "⏸️ <b>CI is waiting for your approval</b>"
          elif wf == "Publish" and concl == "success":
              headline = "🚀 <b>Published</b> — PyPI and the MCP registry"
          elif wf == "Test" and concl == "success":
              # Reads as a deployment-log entry rather than a status code, since on
              # main this is really "your push landed and the tree is healthy".
              headline = "✅ <b>main</b> is green"
          else:
              headline = f'{os.environ["ICON"]} <b>{esc(wf, 40)}</b> {esc(concl, 20)}'

          lines = [
              headline,
              f'<code>{esc(os.environ["REPO"], 120)}</code> · {esc(os.environ["BRANCH"], 60)}',
          ]
          if subject:
              lines += ["", esc(subject, 160)]
          lines += ["", os.environ["RUN_URL"]]

          payload = {
              "chat_id": os.environ["TG_CHAT"],
              "text": "\n".join(lines),
              "parse_mode": "HTML",
              "disable_web_page_preview": True,
          }
          # Only send message_thread_id when a topic is configured: passing it to a
          # non-forum chat is a 400, so an unset variable must mean "omit", not "0".
          topic = (os.environ.get("TG_TOPIC") or "").strip()
          if topic:
              payload["message_thread_id"] = int(topic)
          print(json.dumps(payload))
          PY

          curl -sS --fail-with-body --max-time 20 \
            -X POST "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
            -H 'Content-Type: application/json' \
            -d @/tmp/ci_payload.json > /dev/null

          echo "Notified: $WF_NAME $CONCLUSION on $BRANCH"
