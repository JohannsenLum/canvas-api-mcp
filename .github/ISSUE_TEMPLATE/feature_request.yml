name: Feature request
description: Suggest a tool, prompt, or capability
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Before requesting a new **tool**, check whether the gateway already covers it.
        `search_canvas_api` plus `canvas_request` reach all 1,116 Canvas endpoints, so
        most things are already possible, just less convenient.

        Curated tools are deliberately few. Every one costs context on every turn for
        every user, so the bar is "people ask this often", not "this is possible".

  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do
      description: Describe the task, not the solution.
      placeholder: I want to see which of my group members have submitted…
    validations:
      required: true

  - type: textarea
    id: gateway
    attributes:
      label: Does the gateway already do it?
      description: >
        Try asking your agent to use `search_canvas_api` to find a relevant endpoint,
        then `canvas_request` to call it. Paste what happened.
      placeholder: search_canvas_api("group submissions") returned … and canvas_request …

  - type: dropdown
    id: role
    attributes:
      label: What role does this need
      options:
        - Student: my own data only
        - Educator: teacher or TA in a course
        - Admin: account-level
    validations:
      required: true

  - type: markdown
    attributes:
      value: |
        Educator and admin features are deferred to a later phase, not because they're
        hard, but because they process other people's personal data, which needs a data
        governance conversation first. See
        [docs/DESIGN.md](https://github.com/JohannsenLum/canvas-api-mcp/blob/main/docs/DESIGN.md).
